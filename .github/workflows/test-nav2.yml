name: Test - movensys_navigation_nav2_config

on:
  pull_request:
    branches: [main, devel]
    paths:
      - 'movensys_navigation_nav2_config/**'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: jazzy
            os: ubuntu-24.04
          - ros_distro: humble
            os: ubuntu-22.04

    runs-on: ${{ matrix.os }}
    env:
      NAVIGATION_MODEL: diffbot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ROS ${{ matrix.ros_distro }}
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}

      - name: Setup workspace
        run: |
          mkdir -p ~/movensys_ws/src
          ln -s ${{ github.workspace }} ~/movensys_ws/src/movensys-navigation

      - name: Install dependencies
        run: |
          sudo rosdep init || true
          rosdep update
          cd ~/movensys_ws
          rosdep install --from-paths src --ignore-src -y \
            --rosdistro ${{ matrix.ros_distro }}

      - name: Build
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          cd ~/movensys_ws
          colcon build --symlink-install \
            --packages-select movensys_navigation_nav2_config

      - name: Validate launch files (Python syntax)
        run: |
          cd ${{ github.workspace }}
          for f in movensys_navigation_nav2_config/launch/*.launch.py; do
            echo "py_compile $f"
            python3 -m py_compile "$f"
          done

      - name: Test sim_bridge launch file
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          cd ~/movensys_ws
          source install/setup.bash
          echo '=== launch test: sim_bridge ==='
          timeout 20s ros2 launch movensys_navigation_nav2_config sim_bridge.launch.py \
            use_sim_time:=true \
            || [ $? -eq 124 ] && echo '  OK: sim_bridge exited after 20s'
