name: Test - movensys_navigation_perception

on:
  pull_request:
    branches: [main, devel]
    paths:
      - 'movensys_navigation_perception/**'

# Container jobs default to sh, which has no `source`.
defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: jazzy
            os: ubuntu-24.04
          - ros_distro: humble
            os: ubuntu-22.04

    runs-on: ${{ matrix.os }}
    container: ros:${{ matrix.ros_distro }}-ros-base

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        run: |
          mkdir -p ~/movensys_ws/src
          ln -s ${{ github.workspace }} ~/movensys_ws/src/movensys-navigation

      - name: Install dependencies
        run: |
          apt-get update
          rosdep update --rosdistro ${{ matrix.ros_distro }}
          cd ~/movensys_ws
          rosdep install --from-paths src/movensys-navigation/movensys_navigation_perception \
            --ignore-src -y --rosdistro ${{ matrix.ros_distro }} \
            -t buildtool -t build -t buildtool_export -t build_export -t test \
            --skip-keys isaac_ros_visual_slam

      - name: Build
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          cd ~/movensys_ws
          colcon build --symlink-install \
            --packages-up-to movensys_navigation_perception

      - name: Validate launch files (Python syntax)
        run: |
          cd ${{ github.workspace }}
          for f in movensys_navigation_perception/launch/*.launch.py; do
            echo "py_compile $f"
            python3 -m py_compile "$f"
          done
