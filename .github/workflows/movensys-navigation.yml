name: CI - movensys-navigation

on:
  pull_request:
    branches: [main, devel]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: jazzy
            os: ubuntu-24.04
          - ros_distro: humble
            os: ubuntu-22.04

    runs-on: ${{ matrix.os }}

    container: ros:${{ matrix.ros_distro }}-ros-base
    env:
      NAVIGATION_MODEL: diffbot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        run: |
          mkdir -p ~/movensys_ws/src
          ln -s ${{ github.workspace }} ~/movensys_ws/src/movensys-navigation

      - name: Install dependencies
        run: |
          apt-get update
          rosdep update --rosdistro ${{ matrix.ros_distro }}
          cd ~/movensys_ws
          # This job only compiles (BUILD_TESTING=OFF), so runtime deps such as
          # navigation2, ros_gz_sim and rviz2 are not needed.
          rosdep install --from-paths src --ignore-src -y \
            --rosdistro ${{ matrix.ros_distro }} \
            -t buildtool -t build -t buildtool_export -t build_export \
            --skip-keys isaac_ros_visual_slam

      - name: Build
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          cd ~/movensys_ws
          colcon build --symlink-install --cmake-args -DBUILD_TESTING=OFF
