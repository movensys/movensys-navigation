services:
  movensys_navigation:
    restart: unless-stopped
    build:
      context: .
      dockerfile: isaac-ros_4.1.Dockerfile
      network: host
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: ${IMAGE_NAME}
    container_name: ${CONTAINER_NAME}
    privileged: true
    network_mode: host
    ipc: host
    runtime: nvidia
    working_dir: /home/admin/workspaces/movensys_ws
    entrypoint: ["/usr/local/bin/scripts/workspace-entrypoint.sh"]
    stdin_open: true
    tty: true
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - HOST_USER_UID=${HOST_USER_UID}
      - HOST_USER_GID=${HOST_USER_GID}
      - USER=${USER}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
      - ISAAC_ROS_WS=/home/admin/workspaces/isaac_ros-dev
      - CYCLONEDDS_URI=file:///home/admin/workspaces/cyclonedds.xml
      - DISPLAY
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - ISAAC_ROS_ACCEPT_EULA=1
      - ROS_DISTRO=${ROS_DISTRO}
      - NAVIGATION_MODEL=${NAVIGATION_MODEL}
    volumes:
      - ${ISAAC_ROS_WS}:/home/admin/workspaces/isaac_ros-dev:rw
      - ${MOVENSYS_NAVIGATION_PACKAGES}:/home/admin/workspaces/movensys_ws/src/movensys-navigation:rw
      - ${CYCLONEDDS_DIR}:/home/admin/workspaces/cyclonedds.xml:ro
      - /etc/localtime:/etc/localtime:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/dri:/dev/dri
    devices:
      - /dev/dri
    command: ["/bin/bash","-lc",
              "sudo chown -R admin:admin /home/admin/workspaces/movensys_ws && \
               source /opt/ros/jazzy/setup.bash && \

               cd /home/admin/workspaces/movensys_ws/src && \
               { [ -d serial-ros2 ]            || git clone https://github.com/RoverRobotics-forks/serial-ros2.git serial-ros2; } && \
               { [ -d ros2_wheeltec_n100_imu ] || git clone https://github.com/NDHANA94/ros2_wheeltec_n100_imu.git ros2_wheeltec_n100_imu; } && \

               cd /home/admin/workspaces/movensys_ws && \
               echo ====== Build movensys_navigation ======= && \
               colcon build --symlink-install && \

               echo ====== Build Terminated ======= && \
               source /home/admin/workspaces/movensys_ws/install/setup.bash && \
               export RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION} && \
               exec bash"
              ]
