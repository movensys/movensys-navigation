name: movensys_navigation

services:
  movensys_navigation:
    restart: unless-stopped
    build:
      context: .
      dockerfile: isaac-ros_4.1.Dockerfile
      network: host
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: ${IMAGE_NAME}
    container_name: ${CONTAINER_NAME}
    privileged: true
    network_mode: host
    ipc: host
    runtime: nvidia
    working_dir: /home/admin/workspaces/movensys_ws
    entrypoint:
      - /bin/bash
      - -c
      - |
        SRC=/home/admin/workspaces/movensys_ws/src/movensys-navigation
        HOST_USER_UID=$$(stat -c %u $$SRC 2>/dev/null || echo 1000)
        HOST_USER_GID=$$(stat -c %g $$SRC 2>/dev/null || echo 1000)
        if [ "$$HOST_USER_UID" = 0 ]; then HOST_USER_UID=1000; HOST_USER_GID=1000; fi
        export HOST_USER_UID HOST_USER_GID
        exec /usr/local/bin/scripts/workspace-entrypoint.sh "$$@"
      - --
    stdin_open: true
    tty: true
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - USER=admin
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
      - ISAAC_ROS_WS=/home/admin/workspaces/isaac_ros-dev
      - CYCLONEDDS_URI=file:///home/admin/workspaces/cyclonedds.xml
      - DISPLAY
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - ISAAC_ROS_ACCEPT_EULA=1
      - ROS_DISTRO=${ROS_DISTRO}
      - NAVIGATION_MODEL=${NAVIGATION_MODEL}
    volumes:
      - ${ISAAC_ROS_WS}:/home/admin/workspaces/isaac_ros-dev:rw
      - ${MOVENSYS_NAVIGATION_PACKAGES}:/home/admin/workspaces/movensys_ws/src/movensys-navigation:rw
      - ${CYCLONEDDS_DIR}:/home/admin/workspaces/cyclonedds.xml:ro
      - /etc/localtime:/etc/localtime:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/dri:/dev/dri
    devices:
      - /dev/dri
    command: ["/bin/bash","-lc",
              "SRC=/home/admin/workspaces/movensys_ws/src/movensys-navigation && \
               DDS=/home/admin/workspaces/cyclonedds.xml && \
               HOST_UID=$$(stat -c %u $$SRC) && HOST_GID=$$(stat -c %g $$SRC) && \
               if [ \"$$HOST_UID\" = 0 ]; then \
                 echo \"WARN: $$SRC is root-owned, keeping admin $$(id -u admin):$$(id -g admin)\"; \
                 HOST_UID=$$(id -u admin); HOST_GID=$$(id -g admin); fi && \
               echo ====== Map admin to host $$HOST_UID:$$HOST_GID ======= && \
               if [ \"$$HOST_GID\" != \"$$(id -g admin)\" ]; then \
                 sudo groupmod -g $$HOST_GID admin \
                   || echo \"NOTE: groupmod reported an error, continuing\"; fi && \
               if [ \"$$HOST_UID\" != \"$$(id -u admin)\" ]; then \
                 sudo usermod -u $$HOST_UID admin \
                   || echo \"NOTE: usermod home chown skipped (read-only mounts)\"; fi && \
               sudo find /home/admin -xdev \
                 -path $$SRC -prune -o -path $$DDS -prune -o \
                 ! -user admin -exec chown -h admin:admin {} + \
                   || echo \"WARN: ownership fixup under /home/admin incomplete\" && \
               source /opt/ros/jazzy/setup.bash && \

               cd /home/admin/workspaces/movensys_ws/src && \
               { [ -d serial-ros2 ]            || git clone https://github.com/RoverRobotics-forks/serial-ros2.git serial-ros2; } && \
               { [ -d ros2_wheeltec_n100_imu ] || git clone https://github.com/NDHANA94/ros2_wheeltec_n100_imu.git ros2_wheeltec_n100_imu; } && \

               cd /home/admin/workspaces/movensys_ws && \
               echo ====== Build movensys_navigation ======= && \
               colcon build --symlink-install && \

               echo ====== Build Terminated ======= && \
               source /home/admin/workspaces/movensys_ws/install/setup.bash && \
               export RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION} && \
               exec bash"
              ]
