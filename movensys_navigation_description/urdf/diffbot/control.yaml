controller_manager:
    ros__parameters:
        update_rate: 500
        use_sim_time: True

        joint_state_broadcaster:
            type: joint_state_broadcaster/JointStateBroadcaster

        velocity_controller:
            type: velocity_controllers/JointGroupVelocityController

velocity_controller:
    ros__parameters:
        joints:
            - drivewheel_left_joint
            - drivewheel_right_joint
        interface_name: velocity
        command_interfaces:
            - velocity
        state_interfaces:
            - velocity